{% load static %}

<style type="text/css">
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box ;
}

.container{
    width: 100%;
    height:100vh;
    background-image:linear-gradient(rgba(0,0,50,0.8),rgba(0,0,50,0.8)), url("{% static 'images/Drawing Room.jpg' %}");
    background-position: center;
    background-size: cover;
    position:relative
}

.form-box{
    width:90%;
    max-width: 450px;
    position: absolute;
    top:50%;
    left:50%;
    transform: translate(-50%,-50%);
    background-color: burlywood;
    padding: 50px 60px 70px;
    text-align: center;
}

.form-box h1{
    font-size: 30px;
    margin-bottom: 60px;
    color: #3c00a0;
    position: relative;
}

.form-box h1::after{
    content:'';
    width: 30px;
    height: 4px;
    border-radius: 3px;
    background-color: #3c00a0;
    position:absolute;
    bottom: -12%;
    left: 50%;
    transform: translatex(-50%);
}
.input-field{
    background-color: #eaeaea;
    margin: 15px 0;
    border-radius: 3px;
    display: flex;
    align-items: center;
}

input{
    width: 100%;
    background: 0; 
    border : 0;
    padding: 18px 15px;
}
.input-field i{
    margin-left: 15px;
    color: #999;
}

form p{
    text-align: left;
}
form p a{
    text-decoration: none;
    color: #3c00a0;
}
.btn-field{
    width: 100%;
    display: flex;
    justify-content: center;
}
.btn-field button{
    width: 100%;
    background: #3c00a0 ;
    color: #fff;
    height: 40px;
    border-radius: 20px;
    border: 0;
    outline: 0;
    cursor: pointer;
    transition: background 1s;
}
</style>


<body>
  <div class="container">
    <div class="form-box">
        <h1>Login</h1>
        <form method="post">
            {% csrf_token %}

            {% if error %}
            <div class="alert" style="color: red; margin-bottom: 15px;">
                {{ error }}
            </div>
            {% endif %}

            <div class="input-group">
                <div class="input-field">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" placeholder="Enter Email" name="mail_id" required>
                </div>

                <div class="input-field">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" placeholder="Enter Password" name="pwd" required minlength="6">
                     <i class="fa-solid fa-eye-slash togglePassword" id="togglePassword"></i>
                </div>

                <p>Don't have an account? <a href="sin">Sign Up</a></p>
            </div><br><br>

            <div class="btn-field">
                <button type="submit" name="loginBtn">Login</button>
                <a href="lg"></a></a>
            </div>
        </form>
    </div>
</div>
</body>
