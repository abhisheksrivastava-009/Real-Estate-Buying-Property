<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="Login.css">

    <title  style="text-decoration-color: red;">Real Estate | Property- DreamHouse</title>
    <link rel="icon" href="{% static 'images/shop.icon.jpg' %}" type="image/x-icon"> 
    <script src="https://kit.fontawesome.com/8068abaeaf.js" crossorigin="anonymous"></script>

    <style type="text/css">
      .carousel-item  img{
         width:100%;
         height: 450px;
        }
      .fa-square-facebook
      {
        font-size: 900px;
      }
      .carousel-item video{
        width: 100%;
        height: 450px;
      }

@import url('https://fonts.googleapis.com/css2?family=Rubik+Glitch+Pop&display=swap');
      
      
      body{
        line-height: 1.5;
        font-family: "Rubik Glitch Pop", system-ui;}

      *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      .container{
        max-width: 1170px;
        
        margin: auto;
      }
      .row{
        display: flex;
        flex-wrap: wrap;
      }
      ul{
        list-style:none;
      }
      .footer{
        background-color: #24262b;
        padding:70px 0;
      }
      .footer-col{
        width: 25%;
        padding: 0 15px;
      }
      .footer-col h4{
        font-size: 18px;
        color: #fff;
        text-transform: capitalize;
        margin-bottom: 30px;
        font-weight: 500;
        position: relatives;
        background: red;
      }
      .footer-col h4::before{
        content:'';
        position: absolute;
        left: 0;
        bottom: -10px;
        background-color: #e91e63;
        height: 2px;
        box-sizing: border-box;
        width: 50px;
      }
      .footer-col ul li:not(:last-child){
        margin-bottom: 10px;
      }
      .footer-col ul li a{
        font-size:16px;
        text-transform: capitalize;
        color: #ffffff;
        text-decoration: none;
        font-weight: #bbbbbb;
        display: block;
        transform: all 0.3s ease;
      }
      .footer-col ul li a:hover{
        color:#ffffff;
        padding-left: 8px;
      }
      .footer-col .social-links a{
        display: inline-block;
        height: 40px;
        width: 40px;
        background-color: rgba(255,255,255,0.2);
        margin: 0 10px 10px 0;
        text-align: center;
        line-height: 40px;
        border-radius: 50%;
        color: #ffffff;
        transition: all 0.5s ease;
      }
      .footer-col .social-links a:hover{
        color:#24262b;
        background-color: #ffffff;
      }
      .bottom-bar{
        background-color: #f18930;
        text-align: center;
        padding: 10px 0;
        margin-top: 50px;
      }

      /* responsive */
@media(max-width: 574px){
  .footer-col{
    width: 100%;
  }
}

      
     </style>
     
  </head>
  <body>
